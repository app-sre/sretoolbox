[project]
name = "sretoolbox"
version = "4.0.1"
requires-python = ">=3.12"
description = "Set of libraries commonly used by multiple SRE projects"
readme = "README.md"
license = { text = "Apache 2.0" }

authors = [
    { name = "Red Hat Application SRE Team", email = "sd-app-sre@redhat.com" },
]
dependencies = [
    "python-json-logger >=3.3.0",
    "requests >=2.32.0",
    "semver >=3.0.4",
]


[project.urls]
homepage = "https://github.com/app-sre/sretoolbox"
repository = "https://github.com/app-sre/sretoolbox"
documentation = "https://github.com/app-sre/sretoolbox"

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest-cov==7.1.0",
    "pytest==9.1.1",
    "requests-mock==1.12.1",
    "ruff==0.16.2",
    "types-requests==2.33.0.20260712",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["sretoolbox"]

[tool.hatch.build.targets.wheel]
only-include = ["sretoolbox"]


# Ruff configuration
[tool.ruff]
target-version = 'py312'
line-length = 88
src = ["sretoolbox", "tests"]
extend-exclude = [
    # exclude some common cache and tmp directories
    ".local",
    ".cache",
    "tmp",
    "demo",
]
fix = true

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "CPY",     # Missing copyright header
    "undocumented-public-module",    # Missing docstring in public module
    "undocumented-public-class",    # Missing docstring in public class
    "undocumented-public-method",    # Missing docstring in public method
    "undocumented-public-function",    # Missing docstring in public function
    "undocumented-public-package",    # Missing docstring in public package
    "undocumented-magic-method",    # Missing docstring in magic method
    "undocumented-public-init",    # Missing docstring in __init__
    "incorrect-blank-line-before-class",    # 1 blank line required before class docstring
    "blank-line-before-class",    # No blank lines allowed before class docstring
    "multi-line-summary-first-line",    # multi-line-summary-first-line
    "multi-line-summary-second-line",    # multi-line-summary-second-line
    "D4",      # Doc string style
    "line-too-long",    # Line too long
    "logging-f-string",    # Logging statement uses f-string
    "pandas-use-of-dot-values",   # use to_numpy()
    "too-many-public-methods", # Too many public methods
    "too-many-arguments", # Too many arguments
    "too-many-positional-arguments", # Too many positional arguments
    "assert",    # Use of assert detected. Pytest uses assert
    "suspicious-subprocess-import",    # subprocess import
    "raw-string-in-exception",   # Exception must not use a string literal, assign to variable first
    "f-string-in-exception",   # Exception must not use an f-string literal, assign to variable first
    "raise-vanilla-args",  # Avoid specifying long messages outside the exception class
    "try-consider-else",  # try-consider-else
    # pydoclint
    "DOC",
    # May conflict with the formatter, https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "tab-indentation",
    "indentation-with-invalid-multiple",
    "indentation-with-invalid-multiple-comment",
    "over-indented",
    "docstring-tab-indentation",
    "triple-single-quotes",
    "Q",
    "missing-trailing-comma",
    "prohibited-trailing-comma",
    "single-line-implicit-string-concatenation",
    # Room for future improvements and refactoring
    "any-type",  # Dynamically typed expressions (Any) - needed for generic functions
    "assert-raises-exception",    # `assertRaises(Exception)` should be considered evil
    "boolean-type-hint-positional-argument",  # boolean-typed parameter must be a positional-only parameter
    "boolean-default-value-positional-argument",  # boolean parameter should be a keyword argument
    "magic-value-comparison", # magic value instead of constant
    "no-self-use", # Method `xxx` could be a function, class method, or static method
    "PT",      # Use PyTest stuff instead unittest
    "PTH",     # Prefer Path.xxx over os.xxx
]
[tool.ruff.format]
preview = true

[tool.ruff.lint.isort]
known-first-party = ["sretoolbox"]

[tool.coverage.report]
fail_under = 80

[tool.mypy]
files = ["sretoolbox", "tests"]
enable_error_code = ["truthy-bool", "redundant-expr"]
no_implicit_optional = true
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["pythonjsonlogger.*", "semver.*"]
ignore_missing_imports = true
